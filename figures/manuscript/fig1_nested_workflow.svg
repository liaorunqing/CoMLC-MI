   <g id="text_1">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="11.1897" y="22.068246" transform="rotate(-0 11.1897 22.068246)">a</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="27.1485" y="21.340219" transform="rotate(-0 27.1485 21.340219)">Internal 12-label benchmark: every decision stays inside the outer training fold</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(26.679891 53.089603)">1,700 patients</text>
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(18.916961 60.164065)">91 admission-stage</text>
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(20.540438 67.238655)">features; 12 labels</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(110.540453 56.626897)">5 repeats ×</text>
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(109.006352 63.70136)">5 outer folds</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(186.680194 56.628611)">Outer training patients</text>
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(180.17867 63.703201)">Preprocessing fit here only</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(307.801884 53.09138)">Outer test patients</text>
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(293.529814 60.165843)">Predictions only; never used</text>
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(303.648994 67.240433)">for fitting or decisions</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(69.290133 116.845603)">4 inner folds</text>
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(44.184898 123.920065)">Fold-local imputation, scaling,</text>
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(51.408023 130.994655)">TabPFN top-80 selection</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(176.883008 116.84738)">Inner OOF decisions</text>
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(170.923828 123.921843)">LP-RF–TabPFN weights;</text>
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(165.319609 130.996433)">CatBoost/NN training rounds</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(301.086938 116.845539)">Refit on complete</text>
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(301.26518 123.920002)">outer training fold</text>
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(294.76975 130.994592)">(all 10 model families)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(315.252977 177.827825)">Each patient receives</text>
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(317.965203 184.90597)">one OOF prediction</text>
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(331.510594 191.980433)">per repeat</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(196.694581 181.368675)">Average five OOF</text>
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(190.66837 188.443265)">predictions per patient</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(55.574442 177.829603)">Paired patient bootstrap,</text>
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(54.312528 184.904065)">DeLong/permutation, BH,</text>
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(63.166747 191.978655)">calibration intervals</text>
   </g>
   <g id="text_13">
    <text style="font-size: 5.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #6b7280" x="206.685" y="209.515652" transform="rotate(-0 206.685 209.515652)">Key locked settings are shown; complete model hyperparameters are reported in Methods and Appendix B.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="11.1897" y="229.968246" transform="rotate(-0 11.1897 229.968246)">b</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="27.1485" y="229.240219" transform="rotate(-0 27.1485 229.240219)">Separate cross-cohort mortality transportability stress test</text>
   </g>
   <g id="text_16">
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(48.30143 251.287603)">Krasnoyarsk source</text>
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(34.028344 258.362192)">4 shared admission variables;</text>
    <text style="font-size: 6.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(53.171859 265.436655)">in-hospital death</text>
   </g>
